{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block body %}
<div class="card" style="max-width:360px;margin:60px auto">
  <h2 style="margin-top:0">Owner login</h2>
  {% if error %}<p style="color:#ff6b6b">{{ error }}</p>{% endif %}
  <form method="post">
    <input type="password" name="password" placeholder="Password" autofocus
           style="width:100%;padding:10px;margin-bottom:12px;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:6px">
    <button class="btn" type="submit" style="width:100%">Log in</button>
  </form>
</div>
{% endblock %}
